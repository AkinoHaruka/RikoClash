name: Build Debug
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  BuildDebug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      # - name: Signing properties
      #   env:
      #     SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      #     SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      #     SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      #   run: |
      #     touch signing.properties
      #     echo keystore.password="$SIGNING_STORE_PASSWORD" > signing.properties
      #     echo key.alias="$SIGNING_KEY_ALIAS" >> signing.properties
      #     echo key.password="$SIGNING_KEY_PASSWORD" >> signing.properties
            
      #     echo "cat signing.properties"
      #     cat signing.properties

      - name: Build
        if: success()
        run: ./gradlew --no-daemon app:assembleAlphaDebug app:assembleAlphaRelease
          
      - name: Upload Artifact (arm64-v8a debug)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: RikoClash Debug APK (arm64-v8a)
          path: |
            app/build/outputs/apk/alpha/debug/*-arm64-v8a-*.apk
      
      - name: Upload Artifact (x86_64 debug)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: RikoClash Debug APK (x86_64)
          path: |
            app/build/outputs/apk/alpha/debug/*-x86_64-*.apk

      - name: Upload Artifact (Release APKs)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: RikoClash Release APKs
          path: |
            app/build/outputs/apk/alpha/release/*.apk

      - name: Clean up obsolete release assets
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: |
          for asset in $(gh release view Prerelease-alpha --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true); do
            case "$asset" in
              *arm64-v8a*|*x86_64*) ;;
              *) gh release delete-asset Prerelease-alpha "$asset" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true ;;
            esac
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Git commit info
        id: git_info
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: |
          echo "count=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        with:
          tag_name: Prerelease-alpha
          name: "RikoClash v2.11.35.${{ steps.git_info.outputs.count }} (Auto Build)"
          prerelease: true
          files: |
            app/build/outputs/apk/alpha/release/*.apk
            app/build/outputs/apk/alpha/debug/*.apk
          body: |
            ## RikoClash 自动构建发布 (v2.11.35.${{ steps.git_info.outputs.count }}-${{ steps.git_info.outputs.hash }})
            
            - 📱 手机端（64位 ARM / Redmi Turbo 3）：
              - **Release 版本（推荐）**：`riko-clash-2.11.35-alpha-arm64-v8a-release.apk`
              - **Debug 版本**：`riko-clash-2.11.35-alpha-arm64-v8a-debug.apk`
            - 💻 电脑模拟器（x86_64）：
              - **Release 版本**：`riko-clash-2.11.35-alpha-x86_64-release.apk`
              - **Debug 版本**：`riko-clash-2.11.35-alpha-x86_64-debug.apk`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

